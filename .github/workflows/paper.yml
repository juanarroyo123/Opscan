name: OpScan cartera simulada

# Se activa cuando TU (el dueno del repo) abres un Issue desde el boton "Simular" o "Cerrar" de la web.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: opscan          # misma cola que el escaner: nunca escriben a la vez
  cancel-in-progress: false

jobs:
  paper:
    if: startsWith(github.event.issue.title, 'PAPER') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Organizar carpetas (por si los archivos se subieron sueltos)
        run: |
          if [ ! -f opscan/pipeline.py ]; then
            echo "Archivos sueltos en la raiz: los organizo en carpetas"
            mkdir -p opscan docs config tests/fixtures
            for f in test_*.py fakes.py; do [ -f "$f" ] && mv "$f" tests/; done
            for f in __init__*.py; do
              [ -f "$f" ] && grep -q "__version__" "$f" && cp "$f" opscan/__init__.py
            done
            rm -f __init__*.py
            for f in *.py; do [ -f "$f" ] && mv "$f" opscan/; done
            [ -f opscan/__init__.py ] || echo '__version__ = "2.2.0"' > opscan/__init__.py
            touch tests/__init__.py
            [ -f index.html ] && mv index.html docs/
            for f in sp500.csv nasdaq100.csv catalysts_manual.csv; do [ -f "$f" ] && mv "$f" config/; done
            [ -f config/catalysts_manual.csv ] || echo "ticker,date,type,note" > config/catalysts_manual.csv
            for f in kadoa_trades.json cboe_real_sample.json committee-membership-current.yaml committees-current.yaml legislators-current.yaml; do
              [ -f "$f" ] && mv "$f" tests/fixtures/
            done
          fi

      - name: Recuperar datos (rama data)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "$REPO_URL" data
          else
            mkdir -p data
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Anotar la operacion
        env:
          OPSCAN_DATA_DIR: ${{ github.workspace }}/data
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > issue_body.txt
          python -m opscan.paper --title "$ISSUE_TITLE" --body-file issue_body.txt \
            --issue "${{ github.event.issue.number }}" --result-file paper_result.txt || true
          cat paper_result.txt

      - name: Guardar datos (rama data)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name  "opscan-bot"
          git config user.email "opscan-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "cartera: issue #${{ github.event.issue.number }}"
          git push -q -f "$REPO_URL" data

      - name: Responder y cerrar el Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "$(cat paper_result.txt) — se vera en la web (pestana Seguimiento) tras la proxima actualizacion."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
