name: OpScan cartera simulada

# Anota compras/ventas de la cartera simulada. Se activa:
#  - desde la web (boton "Comprar"/"Vender", con tu token guardado en tu navegador), o
#  - con un Issue "PAPER ABRIR ..." / "PAPER CERRAR ..." abierto por el dueno del repo.
# Las ordenes se guardan en la rama `orders` (cola). El escaner las aplica al empezar,
# asi nunca se pisan aunque haya un escaneo en marcha.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      accion:
        description: "PAPER ABRIR TICKER / PAPER CERRAR M0001"
        required: true
      datos:
        description: "JSON de la operacion"
        required: false
        default: "{}"

permissions:
  contents: write
  issues: write

jobs:
  paper:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'PAPER') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Organizar carpetas (por si los archivos se subieron sueltos)
        run: |
          if [ ! -f opscan/pipeline.py ]; then
            echo "Archivos sueltos en la raiz: los organizo en carpetas"
            mkdir -p opscan docs config tests/fixtures
            for f in test_*.py fakes.py; do [ -f "$f" ] && mv "$f" tests/; done
            for f in __init__*.py; do
              [ -f "$f" ] && grep -q "__version__" "$f" && cp "$f" opscan/__init__.py
            done
            rm -f __init__*.py
            for f in *.py; do [ -f "$f" ] && mv "$f" opscan/; done
            [ -f opscan/__init__.py ] || echo '__version__ = "2.2.0"' > opscan/__init__.py
            touch tests/__init__.py
            [ -f index.html ] && mv index.html docs/
            for f in sp500.csv nasdaq100.csv catalysts_manual.csv; do [ -f "$f" ] && mv "$f" config/; done
            [ -f config/catalysts_manual.csv ] || echo "ticker,date,type,note" > config/catalysts_manual.csv
            for f in kadoa_trades.json cboe_real_sample.json committee-membership-current.yaml committees-current.yaml legislators-current.yaml; do
              [ -f "$f" ] && mv "$f" tests/fixtures/
            done
          fi

      - name: Recuperar cartera (rama data, solo lectura)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "$REPO_URL" data
          else
            mkdir -p data
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Preparar la orden
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IN_ACCION: ${{ github.event.inputs.accion }}
          IN_DATOS: ${{ github.event.inputs.datos }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "$IN_ACCION" > order_title.txt
            printf '%s' "$IN_DATOS" > order_body.txt
          else
            printf '%s' "$ISSUE_TITLE" > order_title.txt
            printf '%s' "$ISSUE_BODY" > order_body.txt
          fi
          cat order_title.txt; echo

      - name: Anotar en la cola (rama orders)
        env:
          OPSCAN_DATA_DIR: ${{ github.workspace }}/data
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          ISSUE_ARG=""
          [ -n "${{ github.event.issue.number }}" ] && ISSUE_ARG="--issue ${{ github.event.issue.number }}"
          for i in 1 2 3 4 5 6; do
            rm -rf orders
            if git ls-remote --exit-code --heads "$REPO_URL" orders >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch orders "$REPO_URL" orders
            else
              mkdir -p orders && (cd orders && git init -q -b orders && git remote add origin "$REPO_URL")
            fi
            python -m opscan.paper --title "$(cat order_title.txt)" --body-file order_body.txt \
              --orders-dir orders --result-file paper_result.txt $ISSUE_ARG
            cd orders
            git config user.name  "opscan-bot"
            git config user.email "opscan-bot@users.noreply.github.com"
            git add -A
            git commit -q -m "orden: $(cat ../order_title.txt)"
            if git push -q origin HEAD:orders; then cd ..; echo "Orden guardada"; cat paper_result.txt; exit 0; fi
            cd ..
            echo "Otra orden se guardo a la vez; reintento ($i)"; sleep $((RANDOM % 5 + 2))
          done
          echo "No se pudo guardar la orden"; exit 1

      - name: Responder y cerrar el Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "$(cat paper_result.txt) — ya se ve en la web (pestana Mi cartera)."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
