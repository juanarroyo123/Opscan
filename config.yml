# =====================================================================
# OpScan - configuracion
# Edita este archivo directamente en GitHub. Todo tiene valores por
# defecto razonables: si borras una clave se usa el valor por defecto.
# =====================================================================

# ---------- Universo de valores a escanear ----------
universe:
  sp500: true          # ~500 valores del S&P 500
  nasdaq100: true      # ~100 valores del Nasdaq 100
  etfs: [SPY, QQQ, IWM, DIA, XLF, XLE, XLV, XBI, XLK, SMH, GLD, SLV, USO, TLT, HYG, KRE, ARKK]
  indices: [SPX, NDX, VIX, RUT]
  # Tus valores propios (biotech, pequenas, etc.). Siempre se escanean.
  watchlist: [CRNX, RCKT, DYN, CADL, AUPH, ACHV, ZVRA, IOVA, MELI, PLTR, SOFI, HOOD, MSTR, COIN, AIT]
  exclude: []
  # Anadir automaticamente las biotech con fecha PDUFA / lectura en el horizonte
  add_catalyst_tickers: true
  max_tickers: 1300
  # Ampliacion: S&P 400 MidCap (empresas medianas, muchas del NYSE). Se omiten solas las que
  # casi no negocian opciones (media < min_avg_opt_vol contratos/dia en las ultimas 20 sesiones).
  midcap400: true
  russell1000: false          # iShares ya no publica el CSV en abierto

  min_avg_opt_vol: 300

# ---------- Escaner de opciones ----------
options:
  sold_weight: 0.0           # opciones VENDIDAS: 0 = solo cuentan las COMPRAS (quien paga por apostar). 0.3 = cuentan algo
  money_weights:              # peso de las opciones COMPRADAS segun donde esta el strike
    otm: 2.0                  # fuera del dinero 3-25 %: apuesta apalancada, lo mas revelador
    atm: 1.3                  # casi en el dinero (0-3 %)
    lottery: 1.2              # muy fuera del dinero (>25 %): mas loteria
    itm: 0.4                  # dentro del dinero: se parece a tener la accion o a una cobertura
  hedge_tickers: []           # valores extra donde las puts OTM se tratan como seguros (indices, ETF y gigantes ya incluidos)
  workers: 12                 # descargas en paralelo
  max_dte: 800                # todos los vencimientos (dias hasta vencimiento)
  min_volume: 100             # volumen minimo de un contrato para ser candidato
  min_vol_oi: 1.0             # volumen >= x veces el OI previo  -> posiciones nuevas
  min_premium: 50000          # prima minima negociada (USD) para marcarlo inusual
  big_premium: 1000000        # "ballena"
  min_dte_unusual: 2          # ignora 0DTE/1DTE (trading intradia, no se confirma por OI)
  min_premium_share: 0.003    # en valores muy liquidos exige >= 0,3% de la prima total del dia
  max_abs_delta_hedge: 0.90   # |delta| mayor = muy ITM, probable cobertura (pesa menos)
  top_flow_rows: 800          # filas en la pestana Flujo
  yfinance_fallback_max: 40   # tickers maximos a pedir a Yahoo si falla Cboe
  oi_confirm_ratio: 0.5       # OI sube >= 50% del volumen marcado => apertura confirmada
  oi_confirm_window: 5        # sesiones durante las que se sigue una alerta

# ---------- Puntuacion / estrategia ----------
scoring:
  catalyst_horizon_days: 45
  congress_window_days: 90
  congress_cluster_days: 30
  entry_min_points: 3         # checklist: congreso(+1) futuros(+1) flujo confirmado(+2)
  alta: 55                    # score >= alta  -> ALTA
  media: 30                   # score >= media -> MEDIA
  entry_min_score: 45         # ENTRADA exige al menos este score
  entry_min_confirmed_premium: 200000   # y al menos $200k de prima confirmada por OI en su direccion
  entry_min_confirm_rate: 0.4 # y que se confirmen >= 40% de las alertas revisadas
  idea_style: simple          # simple = solo comprar call/put | spread = spreads si la IV es cara | auto

# ---------- Cartera simulada ----------
paper:
  capital: 10000              # dinero inicial (USD, simulado)
  max_pct_trade: 5            # % maximo del valor de la cartera por operacion (5% de 10.000 = 500)
  max_new_per_day: 3          # AUTO: como mucho 3 operaciones nuevas al dia (las de mas score)
  max_open_auto: 8            # AUTO: como mucho 8 abiertas a la vez
  skip_bad_liquidity: true    # AUTO: no entra si la liquidez de la opcion es "mala"
  # --- reglas del Robot (act. 17) ---
  half_at_pct: 50             # a +50% vende la mitad; el resto queda protegido en el precio de entrada
  cooldown_days: 4            # tras cerrar con perdida, no vuelve a entrar en ese valor en 4 dias
  min_dte_auto: 30            # vencimiento minimo 30 dias
  amber_min_score: 55         # semaforo ambar: solo score >= 55 (rojo: no abre nada)
  no_index_puts: true         # no compra puts de indices (SPY, QQQ, IWM...): casi todo son coberturas
  # --- operaciones hechas fuera de la web (se meten UNA vez; no borres las ya metidas) ---
  # account: MANUAL = OpScan, RSI = Soportes + RSI. symbol: TICKER + AAMMDD + C/P + strike x1000 (8 cifras)
  seed:
    - {account: RSI, symbol: CHWY261030C00020000, price: 0.28, contracts: 1, opened: "2026-10-05", why: "Soportes + RSI"}
    - {account: RSI, symbol: EFX261016C00150000,  price: 1.53, contracts: 1, opened: "2026-10-05", why: "Soportes + RSI"}
    - {account: RSI, symbol: HD261030C00300000,   price: 2.32, contracts: 1, opened: "2026-10-05", why: "Soportes + RSI"}

# ---------- Compras de directivos (SEC Form 4) ----------
insiders:
  enabled: true
  days: 25                    # dias hacia atras que se revisan
  max_fetch: 1200             # formularios leidos por ejecucion (la primera vez tarda mas)

# ---------- Enriquecimiento (Yahoo) para los mejores candidatos ----------
enrich:
  top_n: 75
  news: 5

# ---------- Calendario ----------
calendar:
  horizon_days: 90
  trial_phases: [PHASE2, PHASE3]
  sec_terms: ["merger agreement", "tender offer", "acquisition agreement"]
  include_clinicaltrials: true
  include_sec: true
  include_opex: true

# ---------- Congreso ----------
congress:
  horizon_days: 365
  include_executive: true
  max_rows: 2500
  max_filer_trades: 60       # mas operaciones en 90d = cartera gestionada, no cuenta como senal

# ---------- Futuros (COT de la CFTC + precio/volumen) ----------
# code = codigo de mercado CFTC; yf = simbolo de Yahoo del futuro continuo
futures:
  cot_years: 3
  markets:
    - {key: ES, name: "E-mini S&P 500", code: "13874A", yf: "ES=F", group: indices}
    - {key: NQ, name: "E-mini Nasdaq 100", code: "209742", yf: "NQ=F", group: indices}
    - {key: YM, name: "E-mini Dow", code: "124603", yf: "YM=F", group: indices}
    - {key: RTY, name: "E-mini Russell 2000", code: "239742", yf: "RTY=F", group: indices}
    - {key: VX, name: "VIX", code: "1170E1", yf: "^VIX", group: indices}
    - {key: ZN, name: "T-Note 10 anos", code: "043602", yf: "ZN=F", group: tipos}
    - {key: ZT, name: "T-Note 2 anos", code: "042601", yf: "ZT=F", group: tipos}
    - {key: ZB, name: "T-Bond 30 anos", code: "020601", yf: "ZB=F", group: tipos}
    - {key: CL, name: "Crudo WTI", code: "067651", yf: "CL=F", group: energia}
    - {key: NG, name: "Gas natural", code: "023651", yf: "NG=F", group: energia}
    - {key: GC, name: "Oro", code: "088691", yf: "GC=F", group: metales}
    - {key: SI, name: "Plata", code: "084691", yf: "SI=F", group: metales}
    - {key: HG, name: "Cobre", code: "085692", yf: "HG=F", group: metales}
    - {key: "6E", name: "Euro FX", code: "099741", yf: "6E=F", group: divisas}
    - {key: "6J", name: "Yen", code: "097741", yf: "6J=F", group: divisas}
    - {key: DX, name: "Dolar index", code: "098662", yf: "DX-Y.NYB", group: divisas}
    - {key: BTC, name: "Bitcoin CME", code: "133741", yf: "BTC=F", group: cripto}
    - {key: ZC, name: "Maiz", code: "002602", yf: "ZC=F", group: agricolas}
    - {key: ZS, name: "Soja", code: "005602", yf: "ZS=F", group: agricolas}
    - {key: ZW, name: "Trigo", code: "001602", yf: "ZW=F", group: agricolas}
  # que futuro da contexto a cada sector GICS (ademas de ES/NQ para todos)
  # un "-" delante invierte la relacion (p.ej. bonos a la baja = tipos arriba = bueno para bancos)
  sector_links:
    Energy: [CL, NG]
    Materials: [GC, HG]
    Financials: ["-ZN"]
    Utilities: [ZN]
    Real Estate: [ZN]

# ---------- Alertas (opcional) ----------
alerts:
  telegram: true      # necesita los secrets TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID
  mode: solo_operaciones   # solo: compras/ventas del Robot y aviso de CERRAR en tus carteras. Pon "completo" para recibir tambien senales, resumen diario e informe semanal
  min_score: 60
  only_entries: true  # solo valores que cumplen el checklist de entrada
